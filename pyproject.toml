[project]
name = "mcp-hub"
version = "0.1.0"
description = "One MCP server exposing GitHub, Jira and Slack tools with Keycloak JWT auth, RBAC and audit logging"
requires-python = ">=3.12"
dependencies = [
  "mcp>=1.20,<2",          # FastMCP API; mcp 2.x changed the server layer
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "httpx>=0.27",
  "pyjwt[crypto]>=2.8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pytest-cov>=5", "respx>=0.21", "ruff>=0.5", "mypy>=1.10"]
dashboard = ["streamlit>=1.35", "pandas>=2"]

[project.scripts]
mcp-hub = "mcp_hub.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "--cov=mcp_hub --cov-report=term-missing --cov-fail-under=85"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts", "evals", "dashboard"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]
ignore = ["S101", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S108"]
"scripts/*" = ["S105", "S106", "S311", "S608"]
"evals/*" = ["S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "scripts", "evals", "dashboard"]

[[tool.mypy.overrides]]
module = ["streamlit.*", "pandas.*"]
ignore_missing_imports = true
