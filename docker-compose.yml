# Local Keycloak with the mcp-hub realm pre-imported. DEV ONLY: demo users and passwords are in the realm file.
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak/realm-mcp-hub.json:/opt/keycloak/data/import/realm-mcp-hub.json:ro
